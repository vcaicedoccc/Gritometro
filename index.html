<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gritómetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Pantalla principal para el público: fondo 1920x1080 con el barril de gritos; la energía
   llena la ventana del barril y el nivel se muestra arriba a la derecha.
   Todo se controla desde configuracion.html en otra pestaña. */
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body.idle{cursor:none}
svg.escena{display:block;width:100vw;height:100vh}
.sacudir{animation:shake .08s linear 12}
@keyframes shake{25%{transform:translate(4px,-2px)}75%{transform:translate(-4px,2px)}}
#bats{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bat{position:absolute;left:-80px;width:48px;animation:fly linear forwards}
.bat svg{width:100%;height:auto;display:block;animation:flap .22s ease-in-out infinite alternate;transform-origin:center}
@keyframes fly{to{transform:translate(calc(100vw + 160px), var(--dy))}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){.sacudir{animation:none}#bats{display:none}}
</style>
</head>
<body>
<svg class="escena" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Nivel de grito">
  <defs>
    <linearGradient id="energia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".3" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ff9d00"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="difuso" x="-100%" y="-50%" width="300%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <!-- Ventana del barril medida sobre el fondo: 100x428 px, centro (834,551), inclinada ~3.85° -->
    <clipPath id="ventana"><rect x="-50" y="-214" width="100" height="428" rx="10"/></clipPath>
  </defs>

  <image href="assets/fondo.jpg" width="1920" height="1080"/>

  <g id="barril">
    <g transform="translate(834 551) rotate(-3.85)">
      <rect id="halo" x="-75" y="-240" width="150" height="480" rx="40" fill="#ffd84a" opacity="0" filter="url(#difuso)"/>
      <g clip-path="url(#ventana)">
        <path id="liquido" fill="url(#energia)" style="mix-blend-mode:screen" d=""/>
        <g id="burbujas"></g>
        <line id="picoLinea" x1="-60" x2="60" y1="214" y2="214" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6" opacity="0"/>
      </g>
    </g>
    <path id="rayos" fill="none" stroke="#fff6c0" stroke-width="3" stroke-linejoin="round" filter="url(#brillo)" d=""/>
  </g>

  <!-- Panel arriba a la derecha (zona vacía del fondo, por encima de Boo) -->
  <g text-anchor="middle">
    <text id="nombre" x="1480" y="150" font-family="Bungee, Impact, sans-serif" font-size="52" fill="#fbe7b5">Gritómetro</text>
    <text id="estado" x="1480" y="262" font-family="Creepster, Impact, fantasy" font-size="88" letter-spacing="3" fill="#ffe14d" filter="url(#brillo)"></text>
    <text id="nivel" x="1480" y="560" font-family="Bungee, Impact, sans-serif" font-size="300" fill="#ffffff" stroke="#000" stroke-width="10" paint-order="stroke" style="font-variant-numeric:tabular-nums">0</text>
    <text id="etiqueta" x="1480" y="626" font-family="IBM Plex Mono, monospace" font-size="30" letter-spacing="10" fill="#a693b4">NIVEL</text>
    <text id="picoTexto" x="1480" y="690" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="34" fill="#f3ece6"></text>
    <text id="ayuda" x="1480" y="330" font-family="IBM Plex Mono, monospace" font-size="24" fill="#a693b4"></text>
  </g>
</svg>
<div id="bats" aria-hidden="true"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canal = new BroadcastChannel('gritometro');
  const MEDIO = 214, ALTO = 428;
  const levelToY = l => MEDIO - (l/100)*ALTO;

  // Estado que envía la pestaña de configuración
  let e = null, recibido = 0, level = 0, t = 0;
  canal.onmessage = ({data}) => {
    if (data.t === 'estado'){ e = data; recibido = performance.now(); }
    else if (data.t === 'celebrar') celebrate();
  };
  const ping = () => canal.postMessage({ t:'ping' });
  ping(); setInterval(ping, 1500);

  const set = (id, v) => { const el = $(id); if (el.textContent !== String(v)) el.textContent = v; };

  // Burbujas dentro de la ventana
  const bubbles = [];
  function spawnBubble(){
    const c = document.createElementNS(NS,'circle');
    const b = { el:c, x: -40 + Math.random()*80, y: MEDIO, r: 2 + Math.random()*4, v: .6 + Math.random()*1.2, w: Math.random()*6 };
    c.setAttribute('r', b.r); c.setAttribute('fill','#fffbe0'); c.setAttribute('fill-opacity','.6');
    $('burbujas').appendChild(c); bubbles.push(b);
  }

  function drawLiquid(){
    const y = levelToY(level);
    const amp = 1.5 + level/30;
    let d = `M-60,${MEDIO+20} L-60,${y}`;
    for (let x=-60;x<=60;x+=6){
      d += ` L${x},${(y + Math.sin(x/14 + t*3)*amp + Math.sin(x/6 - t*5)*amp*.4).toFixed(1)}`;
    }
    $('liquido').setAttribute('d', d + ` L60,${MEDIO+20} Z`);
    $('halo').setAttribute('opacity', (level/100*.55).toFixed(3));

    if (!reduced && level > 2 && Math.random() < .08 + level/90) spawnBubble();
    for (let i=bubbles.length-1;i>=0;i--){
      const b = bubbles[i];
      b.y -= b.v * (1 + level/25);
      b.el.setAttribute('cx', b.x + Math.sin(t*4 + b.w)*3); b.el.setAttribute('cy', b.y);
      if (b.y < y - 2){ b.el.remove(); bubbles.splice(i,1); }
    }
  }

  // Rayos alrededor del barril cuando el grito es fuerte
  function bolt(x1,y1,x2,y2,spread){
    let d = `M${x1.toFixed(0)},${y1.toFixed(0)}`;
    for (let i=1;i<9;i++){
      const k=i/9;
      d += ` L${(x1+(x2-x1)*k+(Math.random()-.5)*spread).toFixed(0)},${(y1+(y2-y1)*k+(Math.random()-.5)*spread).toFixed(0)}`;
    }
    return d + ` L${x2.toFixed(0)},${y2.toFixed(0)}`;
  }
  function drawSparks(){
    if (reduced || level < 55){ $('rayos').setAttribute('d', ''); return; }
    const n = level >= 98 ? 6 : Math.floor((level-55)/12)+1;
    let d = '';
    for (let i=0;i<n;i++){
      if (Math.random() < .55) continue;
      const ang = Math.random()*Math.PI*2, rad = 220 + Math.random()*140;
      const sx = 834 + (Math.random()-.5)*80, sy = 551 + (Math.random()-.5)*380;
      d += bolt(sx, sy, 834 + Math.cos(ang)*rad*.8, 551 + Math.sin(ang)*rad*1.3, 40) + ' ';
    }
    $('rayos').setAttribute('d', d);
  }

  function drawPanel(vivo){
    if (!vivo){
      set('nombre', 'Gritómetro'); set('estado', 'Esperando…');
      set('ayuda', 'Abre /configuracion en otra pestaña · doble clic: pantalla completa');
    } else if (!e.mic){
      set('nombre', e.nombre || 'Gritómetro'); set('estado', 'Micrófono apagado'); set('ayuda', '');
    } else {
      set('nombre', e.nombre || 'Gritómetro'); set('estado', e.texto); set('ayuda', '');
    }
    const resultado = vivo && e.fase === 'resultado';
    const n = resultado ? e.pico : Math.round(level);
    set('nivel', n);
    $('nivel').setAttribute('fill', n >= 70 ? '#ff7a1a' : n >= 40 ? '#ffe14d' : '#ffffff');
    set('etiqueta', resultado ? 'PUNTAJE' : 'NIVEL');
    const enRonda = vivo && (e.fase === 'grita' || resultado);
    set('picoTexto', enRonda ? `Pico de la ronda: ${e.pico}` : '');
    const py = levelToY(enRonda ? e.pico : 0);
    $('picoLinea').setAttribute('y1', py); $('picoLinea').setAttribute('y2', py);
    $('picoLinea').setAttribute('opacity', enRonda && e.pico > 0 ? '.85' : '0');
  }

  function loop(){
    t += 1/60;
    const vivo = !!e && performance.now() - recibido < 4000;
    const target = vivo && e.mic ? e.nivel : 0;
    level += (target - level) * .5;
    drawLiquid(); drawSparks(); drawPanel(vivo);
    requestAnimationFrame(loop);
  }
  loop();

  // Celebración al llegar a 100
  const BAT = '<svg viewBox="0 0 48 22"><path fill="#07040b" d="M0,10 C6,2 12,4 16,10 C18,6 20,6 22,4 L24,8 L26,4 C28,6 30,6 32,10 C36,4 42,2 48,10 C42,10 38,14 36,18 C32,14 28,16 24,20 C20,16 16,14 12,18 C10,14 6,10 0,10 Z"/></svg>';
  function releaseBat(){
    if (reduced) return;
    const b = document.createElement('div');
    b.className = 'bat'; b.innerHTML = BAT;
    b.style.width = (40 + Math.random()*50) + 'px';
    b.style.top = (20 + Math.random()*60) + 'vh';
    b.style.setProperty('--dy', ((Math.random()-.5)*30) + 'vh');
    const dur = 2 + Math.random()*1.5;
    b.style.animationDuration = dur + 's';
    b.firstChild.style.animationDuration = (.15 + Math.random()*.15) + 's';
    $('bats').appendChild(b);
    setTimeout(()=>b.remove(), dur*1000 + 200);
  }
  function celebrate(){
    const z = $('barril');
    z.classList.remove('sacudir'); void z.getBoundingClientRect(); z.classList.add('sacudir');
    for (let i=0;i<14;i++) setTimeout(releaseBat, i*90);
  }

  // Pantalla completa con doble clic o tecla F; el cursor se oculta si no se mueve
  const toggleFs = () => { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(()=>{}); };
  addEventListener('dblclick', toggleFs);
  addEventListener('keydown', ev => { if (ev.key === 'f' || ev.key === 'F') toggleFs(); });
  let idleTimer;
  addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  });
})();
</script>
</body>
</html>
